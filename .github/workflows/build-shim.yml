name: verify-installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/**'
      - 'docker/**'
      - '.github/workflows/build-shim.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    container: docker.io/cachyos/cachyos:latest
    strategy:
      matrix:
        mesa: ['26.2.5', '26.2.6']
    steps:
      - uses: actions/checkout@v4
      - name: Run standalone installer (build + install) on CachyOS
        run: install-cachyos.sh --build --version ${{ matrix.mesa }}
      - uses: actions/upload-artifact@v4
        with:
          name: libvulkan_intel-${{ matrix.mesa }}
          path: /usr/lib/libvulkan_intel.so
